[package]
name = "gamesman-nova"
version = "0.3.0"
authors = ["Max Fierro <maxfierro@berkeley.edu>"]
license = "GPL-3.0"
repository = "https://github.com/GamesCrafters/GamesmanNova"
keywords = ["game", "solver", "strong-solver", "research"]
edition = "2024"
readme = "README.md"
exclude = ["/.github", "/dev", "/doc"]
description = """Research system generating datasets of sequential game states \
and associated features."""

[[bin]]
path = "src/main.rs"
name = "nova"
bench = true
test = true

[profile.release]
codegen-units = 1
debug = true
lto = "fat"

[dependencies]
rusqlite = { version = "0.34.0", features = ["bundled"] }
clap = { version = "^4", features = ["derive"] }
crossbeam-channel = "0.5.15"
modular-bitfield = "^0.13"
derive_builder = "^0.20"
async-trait = "^0.1"
tokio = { version = "^1", features = ["full"] }
serde_json = "^1"
threadpool = "^1"
once_cell = "^1"
mockall = "^0.9"
petgraph = "^0"
exitcode = "^1"
num_cpus = "^1"
anyhow = "^1"
bitvec = "^1"
regex = "^1"
rocksdb = { version = "0.24", default-features = false, features = ["lz4"] }
ratatui = "0.28"
crossterm = "0.28"

[dev-dependencies]
strum_macros = "0.26"
strum = "0.26"
tempfile = "3"
